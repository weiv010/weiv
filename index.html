<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WEIV</title>

  <!-- three · GLTFLoader · MindAR (ES module import map, 공식 CDN) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root { --blue: #0073ff; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0f1e;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-user-select: none; user-select: none; }

    /* MindAR가 video/canvas의 크기·위치를 직접 계산해 마커와 정렬하므로
       여기서 크기를 강제하지 않는다 (강제 시 모델이 한쪽으로 밀림). */
    #ar-container { position: fixed; inset: 0; overflow: hidden; }

    /* ── 시작 화면 ───────────────────────────── */
    #splash { position: fixed; inset: 0; z-index: 100; background: #0a0f1e;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 30px; padding: 32px; transition: opacity 0.5s ease; }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .splash-logo { font-size: 44px; font-weight: 900; letter-spacing: 0.18em; color: #fff; }
    .splash-logo span { color: var(--blue); }
    .splash-title { font-size: 16px; color: rgba(255,255,255,0.6); letter-spacing: 0.04em; }
    #start-btn { padding: 17px 56px; border-radius: 999px; background: var(--blue); color: #fff;
      font-size: 17px; font-weight: 700; border: none; cursor: pointer; -webkit-appearance: none;
      box-shadow: 0 6px 26px rgba(0,115,255,0.5); letter-spacing: 0.04em; }
    #start-btn:active { transform: scale(0.97); opacity: 0.9; }
    .bar-wrap { width: 150px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.15); overflow: hidden; display: none; }
    .bar { height: 100%; width: 0%; background: var(--blue); transition: width 0.4s ease; }
    #loading-text { display: none; font-size: 12px; color: rgba(255,255,255,0.45); text-align: center; white-space: pre-line; line-height: 1.7; }
    #error-box { display: none; flex-direction: column; align-items: center; gap: 16px; max-width: 320px; }
    #error-box.show { display: flex; }
    #error-title { font-size: 15px; font-weight: 700; color: #f87171; }
    #error-msg { font-size: 13px; color: rgba(255,255,255,0.6); text-align: center; line-height: 1.8; white-space: pre-line; }
    #retry-btn { padding: 12px 36px; border-radius: 999px; background: rgba(255,255,255,0.14); color: #fff;
      font-size: 15px; font-weight: 700; border: 1.5px solid rgba(255,255,255,0.25); cursor: pointer; -webkit-appearance: none; }

    /* ── 스캔 안내 (카드 인식 전) ─────────────── */
    #hint { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 9;
      display: flex; flex-direction: column; align-items: center; gap: 16px; width: 84%;
      pointer-events: none; transition: opacity 0.5s; }
    #hint.hidden { opacity: 0; }
    .hint-card { width: 76px; height: 76px; color: rgba(255,255,255,0.9);
      filter: drop-shadow(0 2px 10px rgba(0,0,0,0.45)); animation: float 2.4s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); opacity: 0.9; } 50% { transform: translateY(-6px); opacity: 0.6; } }
    .hint-text { font-size: 18px; font-weight: 700; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.55); letter-spacing: 0.01em; }

    /* ── 모드 토글 (1번 카드에서만) ───────────── */
    #toggle { position: fixed; left: 50%; transform: translateX(-50%) translateY(20px);
      bottom: calc(env(safe-area-inset-bottom, 20px) + 26px); z-index: 12;
      display: flex; align-items: center; padding: 6px; gap: 2px;
      background: rgba(255,255,255,0.16); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255,255,255,0.28); border-radius: 999px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3); opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    #toggle.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
    .seg { position: relative; z-index: 1; min-width: 96px; height: 52px; padding: 0 22px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      font-size: 17px; font-weight: 700; color: rgba(255,255,255,0.7); transition: color 0.25s; }
    .seg.active { color: #fff; }
    #seg-pill { position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc(50% - 6px);
      border-radius: 999px; background: var(--blue); box-shadow: 0 4px 16px rgba(0,115,255,0.5);
      transition: left 0.3s cubic-bezier(0.34,1.56,0.64,1); z-index: 0; }
    #toggle.shape #seg-pill { left: 50%; }

    /* ── 반응형: iPad 가로 ───────────────────── */
    @media (orientation: landscape) and (min-width: 720px) {
      #toggle { bottom: calc(env(safe-area-inset-bottom, 24px) + 40px); padding: 7px; }
      .seg { min-width: 120px; height: 60px; font-size: 19px; }
      .splash-logo { font-size: 52px; }
      .hint-text { font-size: 20px; }
    }
  </style>
</head>
<body>

<div id="ar-container"></div>

<!-- 스캔 안내 -->
<div id="hint" class="hidden">
  <svg class="hint-card" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="2.5"/>
    <path d="M7 15l3.2-3.4 2.3 2.2 2.4-3 2.1 2.6"/>
    <circle cx="8.4" cy="9.2" r="1.2" fill="currentColor" stroke="none"/>
  </svg>
  <div class="hint-text">카드를 비춰주세요</div>
</div>

<!-- 모드 토글: 1번 카드 인식 시에만 표시 -->
<div id="toggle">
  <div id="seg-pill"></div>
  <div class="seg active" id="seg-default">기본</div>
  <div class="seg" id="seg-shape">도형</div>
</div>

<!-- 시작 화면 -->
<div id="splash">
  <div class="splash-logo">W<span>E</span>IV</div>
  <div class="splash-title">카드를 비춰주세요</div>
  <button id="start-btn">시작</button>
  <div class="bar-wrap" id="bar-wrap"><div class="bar" id="bar"></div></div>
  <div id="loading-text">로딩 중...</div>
  <div id="error-box">
    <div id="error-title">시작할 수 없어요</div>
    <div id="error-msg"></div>
    <button id="retry-btn">다시 시도</button>
  </div>
</div>

<!-- 진단: 모듈/CDN 로딩 실패 시 화면이 조용히 멈추지 않고 원인 표시 -->
<script>
  (function () {
    function surface(text) {
      var g = function (id) { return document.getElementById(id); };
      if (g('bar-wrap')) g('bar-wrap').style.display = 'none';
      if (g('loading-text')) g('loading-text').style.display = 'none';
      if (g('start-btn')) g('start-btn').style.display = 'none';
      if (g('error-title')) g('error-title').textContent = '실행 오류';
      if (g('error-msg')) g('error-msg').textContent = text;
      if (g('error-box')) g('error-box').classList.add('show');
    }
    window.addEventListener('error', function (e) {
      if (window.__weivReady) return;
      surface('스크립트를 불러오지 못했어요.\n인터넷 연결, 또는 광고차단·사내망에서 CDN(jsdelivr) 접속이 막혔는지 확인해 주세요.\n\n' + ((e && e.message) || ''));
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      if (window.__weivReady) return;
      surface('초기화 중 오류가 발생했어요.\n' + ((e && e.reason && (e.reason.message || e.reason)) || ''));
    });
    window.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () { if (!window.__weivReady) surface('스크립트 로딩이 지연되고 있어요.\n네트워크를 확인하거나 새로고침해 주세요.\n(CDN 접속 차단 가능성)'); }, 8000);
    });
  })();
</script>

<script type="module">
  window.__weivReady = true;
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { MindARThree } from 'mindar-image-three';

  const $ = (id) => document.getElementById(id);
  const splashEl = $('splash'), startBtn = $('start-btn'), barWrap = $('bar-wrap'),
        bar = $('bar'), loadingTxt = $('loading-text'), errorBox = $('error-box'),
        hintEl = $('hint'), toggleEl = $('toggle');

  // 워치독 오탐 복구 + 초기 상태 보장
  errorBox.classList.remove('show'); startBtn.style.display = '';
  barWrap.style.display = 'none'; loadingTxt.style.display = 'none';

  let started = false, isShape = false;
  let card1Found = false, card2Found = false;
  let carDefault = null, carShape = null, carFind = null;
  let mindarThree = null, renderer = null, scene = null, camera = null;

  function setProgress(pct, text) { bar.style.width = pct + '%'; loadingTxt.textContent = text; }
  function showProgress() {
    startBtn.style.display = 'none';
    document.querySelector('.splash-title').style.display = 'none';
    errorBox.classList.remove('show');
    barWrap.style.display = 'block'; loadingTxt.style.display = 'block';
  }
  function showError(title, msg) {
    barWrap.style.display = 'none'; loadingTxt.style.display = 'none';
    $('error-title').textContent = title; $('error-msg').textContent = msg;
    errorBox.classList.add('show');
  }
  function updateHint() {
    const anyFound = card1Found || card2Found;
    hintEl.classList.toggle('hidden', anyFound);
  }
  function updateToggle() {
    toggleEl.classList.toggle('show', card1Found);      // 1번 카드에서만
  }

  // iOS Safari: 권한은 HTTPS + 탭 제스처 안에서. 무거운 로딩 전에 먼저 요청.
  async function requestCameraPermission() {
    if (!window.isSecureContext) throw { _kind: 'insecure' };
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw { _kind: 'unsupported' };
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); }
    catch (e) {
      if (e && (e.name === 'OverconstrainedError' || e.name === 'NotFoundError'))
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
      else throw e;
    }
    stream.getTracks().forEach(t => t.stop());
  }

  function loadGLB(src) {
    return new Promise((resolve, reject) => {
      new GLTFLoader().load(src, (gltf) => {
        const model = gltf.scene;
        // 최대 치수를 1로 정규화하고, 모든 축을 카드 중심에 정렬
        let box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const s = 1.0 / Math.max(size.x, size.y, size.z);
        model.scale.setScalar(s);
        model.updateMatrixWorld(true);
        box = new THREE.Box3().setFromObject(model);
        model.position.sub(box.getCenter(new THREE.Vector3()));  // 카드 중심 정렬
        resolve(model);
      }, undefined, reject);
    });
  }

  async function start() {
    if (started) return;
    started = true;
    showProgress();

    setProgress(15, '카메라 권한을 요청합니다...\n(팝업에서 "허용"을 눌러주세요)');
    try { await requestCameraPermission(); }
    catch (e) {
      started = false;
      if (e && e._kind === 'insecure') showError('보안 연결이 필요해요', 'HTTPS 주소에서만 카메라를 쓸 수 있어요.\nGitHub Pages(https://)로 접속해 주세요.');
      else if (e && e._kind === 'unsupported') showError('카메라를 지원하지 않아요', '사파리 최신 버전에서 다시 시도해 주세요.');
      else if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) showError('카메라 권한이 거부됐어요', '설정 › Safari › 카메라 › "허용"으로 바꾼 뒤\n새로고침하고 다시 시도해 주세요.');
      else if (e && e.name === 'NotReadableError') showError('카메라를 사용할 수 없어요', '다른 앱이 카메라를 쓰고 있는지 확인 후\n다시 시도해 주세요.');
      else showError('카메라 오류', (e && (e.name + (e.message ? ': ' + e.message : ''))) || '알 수 없는 오류');
      return;
    }

    setProgress(35, 'AR 엔진 초기화 중...');
    try {
      mindarThree = new MindARThree({
        container: $('ar-container'),
        imageTargetSrc: './targets.mind',
        maxTrack: 2,                 // 두 카드 동시/독립 추적
        uiLoading: 'no', uiScanning: 'no', uiError: 'no',
        filterMinCF: 0.0001, filterBeta: 1000,   // 떨림(지터) 완화
      });
      ({ renderer, scene, camera } = mindarThree);
    } catch (e) { started = false; showError('AR 엔진 로드 실패', '네트워크를 확인하고 다시 시도해 주세요.'); return; }

    // 광원: 이전 대비 50%로 낮춤 (모델이 너무 밝게 날아가던 문제 완화)
    scene.add(new THREE.AmbientLight(0xffffff, 0.45));
    const dir = new THREE.DirectionalLight(0xffffff, 0.5); dir.position.set(0, 4, 5); scene.add(dir);

    try {
      setProgress(55, '모델 로딩 중... (1/3)');
      carDefault = await loadGLB('./car_default.glb');
      setProgress(72, '모델 로딩 중... (2/3)');
      carShape = await loadGLB('./car_shape.glb');
      setProgress(88, '모델 로딩 중... (3/3)');
      carFind = await loadGLB('./car_find.glb');
    } catch (e) { started = false; showError('3D 모델 로드 실패', '모델 파일을 불러오지 못했어요.\n다시 시도해 주세요.'); return; }

    // 1번 카드: 캠핑카 (기본/도형 토글)
    const anchor1 = mindarThree.addAnchor(0);
    anchor1.group.add(carDefault); anchor1.group.add(carShape);
    carDefault.visible = !isShape; carShape.visible = isShape;
    anchor1.onTargetFound = () => { card1Found = true; updateHint(); updateToggle(); };
    anchor1.onTargetLost  = () => { card1Found = false; updateHint(); updateToggle(); };

    // 2번 카드: 발견모드 (UI 없음)
    const anchor2 = mindarThree.addAnchor(1);
    anchor2.group.add(carFind);
    anchor2.onTargetFound = () => { card2Found = true; updateHint(); };
    anchor2.onTargetLost  = () => { card2Found = false; updateHint(); };

    setProgress(96, 'AR 시작 중...');
    try { await mindarThree.start(); }
    catch (e) {
      started = false;
      showError('AR 시작 실패', (e && e.name === 'NotAllowedError')
        ? '카메라 권한이 거부됐어요. 설정에서 허용 후 다시 시도해 주세요.' : '다시 시도해 주세요.');
      return;
    }

    setProgress(100, '완료!');
    setTimeout(() => {
      splashEl.classList.add('hidden');
      setTimeout(() => { splashEl.style.display = 'none'; hintEl.classList.remove('hidden'); }, 500);
    }, 250);

    renderer.setAnimationLoop(() => renderer.render(scene, camera));

    // 레이아웃(주소창·Safe Area·스플래시 제거)이 안정된 뒤 정렬을 다시 계산해
    // 모델이 한쪽으로 밀리는 현상을 방지 (MindAR는 'resize' 이벤트에 반응).
    forceResize(); setTimeout(forceResize, 300); setTimeout(forceResize, 800); setTimeout(forceResize, 1600);
  }

  function forceResize() { if (mindarThree) window.dispatchEvent(new Event('resize')); }
  window.addEventListener('orientationchange', () => { setTimeout(forceResize, 350); setTimeout(forceResize, 900); });

  startBtn.addEventListener('click', start);
  $('retry-btn').addEventListener('click', () => {
    errorBox.classList.remove('show'); startBtn.style.display = '';
    document.querySelector('.splash-title').style.display = '';
    setProgress(0, '로딩 중...'); start();
  });

  // 기본 ↔ 도형 토글 (1번 카드 모델만 전환, 애니메이션 없음)
  function setShape(v) {
    isShape = v;
    toggleEl.classList.toggle('shape', isShape);
    $('seg-default').classList.toggle('active', !isShape);
    $('seg-shape').classList.toggle('active', isShape);
    if (carDefault && carShape) { carDefault.visible = !isShape; carShape.visible = isShape; }
  }
  $('seg-default').addEventListener('click', () => setShape(false));
  $('seg-shape').addEventListener('click', () => setShape(true));
</script>
</body>
</html>
