<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WEIV</title>

  <!-- three · GLTFLoader · MindAR (ES module import map, 공식 CDN) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    /* ── Figma 컬러 토큰 ─────────────────────── */
    :root {
      --main: #0073ff;
      --white: #ffffff;
      --gray1: #f6f6f6;
      --gray2: #c6c6c6;
      --ink: #0a0f1e;
      --sa-top: env(safe-area-inset-top, 0px);
      --sa-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-user-select: none; user-select: none; }

    #ar { position: fixed; inset: 0; overflow: hidden; }

    /* ── 헤더 (로고 + WEIV) ──────────────────── */
    #header { position: fixed; top: 0; left: 0; right: 0; z-index: 12;
      display: flex; align-items: center; gap: 12px;
      padding: calc(var(--sa-top) + 18px) 20px 14px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.35), transparent);
      opacity: 0; transition: opacity 0.4s; pointer-events: none; }
    #header.show { opacity: 1; }
    .logo-badge { width: 30px; height: 30px; border-radius: 8px; background: var(--main);
      display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .logo-badge img { width: 22px; height: 22px; object-fit: contain; }
    .wordmark { font-size: 20px; font-weight: 800; letter-spacing: 0.14em; color: var(--white); }

    /* ── 시작 화면 ───────────────────────────── */
    #splash { position: fixed; inset: 0; z-index: 100; background: var(--ink);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 28px; padding: 32px; transition: opacity 0.5s ease; }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .splash-logo { font-size: 46px; font-weight: 900; letter-spacing: 0.18em; color: var(--white); }
    .splash-logo span { color: var(--main); }
    .splash-title { font-size: 16px; color: rgba(255,255,255,0.6); letter-spacing: 0.04em; }
    #start-btn { padding: 17px 56px; border-radius: 999px; background: var(--main); color: var(--white);
      font-size: 17px; font-weight: 700; border: none; cursor: pointer; -webkit-appearance: none;
      box-shadow: 0 6px 26px rgba(0,115,255,0.5); }
    #start-btn:active { transform: scale(0.97); opacity: 0.9; }
    .bar-wrap { width: 150px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.15); overflow: hidden; display: none; }
    .bar { height: 100%; width: 0%; background: var(--main); transition: width 0.4s ease; }
    #loading-text { display: none; font-size: 12px; color: rgba(255,255,255,0.45); text-align: center; white-space: pre-line; line-height: 1.7; }
    #error-box { display: none; flex-direction: column; align-items: center; gap: 16px; max-width: 320px; }
    #error-box.show { display: flex; }
    #error-title { font-size: 15px; font-weight: 700; color: #f87171; }
    #error-msg { font-size: 13px; color: rgba(255,255,255,0.6); text-align: center; line-height: 1.8; white-space: pre-line; }
    #retry-btn { padding: 12px 36px; border-radius: 999px; background: rgba(255,255,255,0.14); color: var(--white);
      font-size: 15px; font-weight: 700; border: 1.5px solid rgba(255,255,255,0.25); cursor: pointer; -webkit-appearance: none; }

    /* ── 스캔 안내 ───────────────────────────── */
    #hint { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 9;
      display: flex; flex-direction: column; align-items: center; gap: 16px; width: 84%;
      pointer-events: none; transition: opacity 0.5s; }
    #hint.hidden { opacity: 0; }
    .hint-card { width: 74px; height: 74px; color: rgba(255,255,255,0.9);
      filter: drop-shadow(0 2px 10px rgba(0,0,0,0.45)); animation: float 2.4s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); opacity: 0.9; } 50% { transform: translateY(-6px); opacity: 0.6; } }
    .hint-text { font-size: 18px; font-weight: 700; color: var(--white); text-shadow: 0 2px 8px rgba(0,0,0,0.55); }

    /* ── 하단 컨트롤 도크 ────────────────────── */
    #dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      padding: 18px 20px calc(var(--sa-bottom) + 26px);
      pointer-events: none; }
    #dock > * { pointer-events: auto; }

    /* 광원 슬라이더 (STEP3) */
    #light-row { display: none; align-items: center; gap: 12px; width: 100%; max-width: 300px;
      padding: 12px 16px; border-radius: 999px;
      background: rgba(255,255,255,0.16); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(255,255,255,0.28); }
    #light-row.show { display: flex; }
    .sun { width: 20px; height: 20px; color: var(--white); flex-shrink: 0; }
    #light { -webkit-appearance: none; appearance: none; flex: 1; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.35); outline: none; }
    #light::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
      background: var(--white); box-shadow: 0 2px 8px rgba(0,0,0,0.3); cursor: pointer; }
    #light::-moz-range-thumb { width: 22px; height: 22px; border: none; border-radius: 50%; background: var(--white); }

    /* 모드 토글 (STEP1) — texture(기본) / frame(도형) */
    #toggle { display: none; align-items: center; padding: 6px; position: relative;
      background: rgba(255,255,255,0.16); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(255,255,255,0.28); border-radius: 999px; box-shadow: 0 8px 28px rgba(0,0,0,0.3); }
    #toggle.show { display: inline-flex; }
    #toggle-pill { position: absolute; top: 6px; bottom: 6px; left: 6px; width: 52px; border-radius: 999px;
      background: var(--main); box-shadow: 0 4px 14px rgba(0,115,255,0.5);
      transition: left 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    #toggle.frame #toggle-pill { left: calc(100% - 58px); }
    .seg { position: relative; z-index: 1; width: 52px; height: 46px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: rgba(255,255,255,0.6); transition: color 0.25s; }
    .seg.active { color: var(--white); }
    .seg svg { width: 26px; height: 26px; }

    @media (orientation: landscape) and (min-width: 720px) {
      #dock { padding-bottom: calc(var(--sa-bottom) + 40px); }
      .seg { width: 60px; height: 54px; }
      #toggle-pill { width: 60px; }
      #toggle.frame #toggle-pill { left: calc(100% - 66px); }
      #light-row { max-width: 360px; }
    }
  </style>
</head>
<body>

<div id="ar"></div>

<!-- 헤더 -->
<div id="header">
  <div class="logo-badge"><img src="logo.png" alt="WEIV" /></div>
  <div class="wordmark">WEIV</div>
</div>

<!-- 스캔 안내 -->
<div id="hint" class="hidden">
  <svg class="hint-card" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="2.5"/>
    <path d="M7 15l3.2-3.4 2.3 2.2 2.4-3 2.1 2.6"/><circle cx="8.4" cy="9.2" r="1.2" fill="currentColor" stroke="none"/>
  </svg>
  <div class="hint-text">카드를 비춰주세요</div>
</div>

<!-- 하단 컨트롤 -->
<div id="dock">
  <!-- STEP3: 광원 -->
  <div id="light-row">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
    <input type="range" id="light" min="0" max="100" value="50" />
  </div>
  <!-- STEP1: 기본/도형 -->
  <div id="toggle">
    <div id="toggle-pill"></div>
    <div class="seg active" id="seg-texture" title="기본">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <path d="M3.27 6.96 12 12.01l8.73-5.05M12 22.08V12" fill="none"/>
      </svg>
    </div>
    <div class="seg" id="seg-frame" title="도형">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 2.4">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <path d="M3.27 6.96 12 12.01l8.73-5.05M12 22.08V12"/>
      </svg>
    </div>
  </div>
</div>

<!-- 시작 화면 -->
<div id="splash">
  <div class="splash-logo">W<span>E</span>IV</div>
  <div class="splash-title">카드를 비춰주세요</div>
  <button id="start-btn">시작</button>
  <div class="bar-wrap" id="bar-wrap"><div class="bar" id="bar"></div></div>
  <div id="loading-text">로딩 중...</div>
  <div id="error-box">
    <div id="error-title">시작할 수 없어요</div>
    <div id="error-msg"></div>
    <button id="retry-btn">다시 시도</button>
  </div>
</div>

<!-- 진단: 모듈/CDN 로딩 실패 시 원인 표시 -->
<script>
  (function () {
    function surface(text) {
      var g = function (id) { return document.getElementById(id); };
      if (g('bar-wrap')) g('bar-wrap').style.display = 'none';
      if (g('loading-text')) g('loading-text').style.display = 'none';
      if (g('start-btn')) g('start-btn').style.display = 'none';
      if (g('error-title')) g('error-title').textContent = '실행 오류';
      if (g('error-msg')) g('error-msg').textContent = text;
      if (g('error-box')) g('error-box').classList.add('show');
    }
    window.addEventListener('error', function (e) {
      if (window.__weivReady) return;
      surface('스크립트를 불러오지 못했어요.\n인터넷 연결, 또는 광고차단·사내망에서 CDN(jsdelivr) 접속이 막혔는지 확인해 주세요.\n\n' + ((e && e.message) || ''));
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      if (window.__weivReady) return;
      surface('초기화 중 오류가 발생했어요.\n' + ((e && e.reason && (e.reason.message || e.reason)) || ''));
    });
    window.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () { if (!window.__weivReady) surface('스크립트 로딩이 지연되고 있어요.\n네트워크를 확인하거나 새로고침해 주세요.\n(CDN 접속 차단 가능성)'); }, 8000);
    });
  })();
</script>

<script type="module">
  window.__weivReady = true;
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { MindARThree } from 'mindar-image-three';

  const $ = (id) => document.getElementById(id);
  const splashEl = $('splash'), startBtn = $('start-btn'), barWrap = $('bar-wrap'), bar = $('bar'),
        loadingTxt = $('loading-text'), errorBox = $('error-box'),
        headerEl = $('header'), hintEl = $('hint'), toggleEl = $('toggle'), lightRow = $('light-row');
  errorBox.classList.remove('show'); startBtn.style.display = '';
  barWrap.style.display = 'none'; loadingTxt.style.display = 'none';

  const MODEL_SCALE = 1.0;
  let started = false, isShape = false;
  let mindarThree = null, renderer = null, scene = null, camera = null;
  let ambient = null, dirLight = null;
  let bearDefault = null, bearShape = null;   // STEP1
  // 스텝별 인식 상태
  const foundStep = { 1: false, 2: false, 3: false };

  function setProgress(pct, text) { bar.style.width = pct + '%'; loadingTxt.textContent = text; }
  function showProgress() {
    startBtn.style.display = 'none';
    document.querySelector('.splash-title').style.display = 'none';
    errorBox.classList.remove('show');
    barWrap.style.display = 'block'; loadingTxt.style.display = 'block';
  }
  function showError(title, msg) {
    barWrap.style.display = 'none'; loadingTxt.style.display = 'none';
    $('error-title').textContent = title; $('error-msg').textContent = msg;
    errorBox.classList.add('show');
  }
  function refreshUI() {
    const any = foundStep[1] || foundStep[2] || foundStep[3];
    hintEl.classList.toggle('hidden', any);
    headerEl.classList.toggle('show', any);
    toggleEl.classList.toggle('show', foundStep[1]);   // STEP1에서만 기본/도형 토글
    lightRow.classList.toggle('show', foundStep[3]);   // STEP3에서만 광원
  }

  async function requestCameraPermission() {
    if (!window.isSecureContext) throw { _kind: 'insecure' };
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw { _kind: 'unsupported' };
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); }
    catch (e) {
      if (e && (e.name === 'OverconstrainedError' || e.name === 'NotFoundError'))
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
      else throw e;
    }
    stream.getTracks().forEach(t => t.stop());
  }

  // 카드를 바닥처럼: up(+Y)을 카드 법선(+Z)으로 세우고, X·Y 중심, 밑면을 카드 면(z=0)에
  function prep(model) {
    let box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    model.scale.setScalar(MODEL_SCALE / Math.max(size.x, size.y, size.z));
    model.rotation.x = Math.PI / 2;
    model.updateMatrixWorld(true);
    box = new THREE.Box3().setFromObject(model);
    const c = box.getCenter(new THREE.Vector3());
    model.position.x -= c.x; model.position.y -= c.y; model.position.z -= box.min.z;
    return model;
  }
  function loadGLB(src) {
    return new Promise((resolve, reject) => {
      new GLTFLoader().load(src, (gltf) => resolve(prep(gltf.scene)), undefined, reject);
    });
  }

  async function start() {
    if (started) return;
    started = true;
    showProgress();

    setProgress(12, '카메라 권한을 요청합니다...\n(팝업에서 "허용"을 눌러주세요)');
    try { await requestCameraPermission(); }
    catch (e) {
      started = false;
      if (e && e._kind === 'insecure') showError('보안 연결이 필요해요', 'HTTPS 주소에서만 카메라를 쓸 수 있어요.\nGitHub Pages(https://)로 접속해 주세요.');
      else if (e && e._kind === 'unsupported') showError('카메라를 지원하지 않아요', '사파리 최신 버전에서 다시 시도해 주세요.');
      else if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) showError('카메라 권한이 거부됐어요', '설정 › Safari › 카메라 › "허용"으로 바꾼 뒤\n새로고침하고 다시 시도해 주세요.');
      else if (e && e.name === 'NotReadableError') showError('카메라를 사용할 수 없어요', '다른 앱이 카메라를 쓰고 있는지 확인 후\n다시 시도해 주세요.');
      else showError('카메라 오류', (e && (e.name + (e.message ? ': ' + e.message : ''))) || '알 수 없는 오류');
      return;
    }

    setProgress(30, 'AR 엔진 초기화 중...');
    try {
      mindarThree = new MindARThree({
        container: $('ar'),
        imageTargetSrc: './targets.mind',
        maxTrack: 2,
        uiLoading: 'no', uiScanning: 'no', uiError: 'no',
        warmupTolerance: 2, missTolerance: 20,
        filterMinCF: 0.0004, filterBeta: 1000,   // 정지 시 떨림 완화 + 반응 유지
      });
      ({ renderer, scene, camera } = mindarThree);
    } catch (e) { started = false; showError('AR 엔진 로드 실패', '네트워크를 확인하고 다시 시도해 주세요.'); return; }

    ambient = new THREE.AmbientLight(0xffffff, 0.6);
    dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    setLightAngle(0.5);                                   // 초기 광원 방향
    scene.add(ambient, dirLight);

    let bear2, shapes3;
    try {
      setProgress(45, '모델 로딩 중... (1/4)');
      bearDefault = await loadGLB('./teddybear1_default.glb');
      setProgress(62, '모델 로딩 중... (2/4)');
      bearShape = await loadGLB('./teddybear1_shape.glb');
      setProgress(80, '모델 로딩 중... (3/4)');
      bear2 = await loadGLB('./teddybear2.glb');
      setProgress(90, '모델 로딩 중... (4/4)');
      shapes3 = await loadGLB('./teddybear1_shape.glb');   // STEP3 기본도형(별도 인스턴스)
    } catch (e) { started = false; showError('3D 모델 로드 실패', '모델 파일을 불러오지 못했어요.\n다시 시도해 주세요.'); return; }

    // STEP1 (target 0): 기본/도형 토글
    const a1 = mindarThree.addAnchor(0);
    a1.group.add(bearDefault); a1.group.add(bearShape);
    bearDefault.visible = !isShape; bearShape.visible = isShape;
    a1.onTargetFound = () => { foundStep[1] = true; refreshUI(); };
    a1.onTargetLost  = () => { foundStep[1] = false; refreshUI(); };

    // STEP2 (target 1): 발견 (컨트롤 없음)
    const a2 = mindarThree.addAnchor(1);
    a2.group.add(bear2);
    a2.onTargetFound = () => { foundStep[2] = true; refreshUI(); };
    a2.onTargetLost  = () => { foundStep[2] = false; refreshUI(); };

    // STEP3 (target 2): 기본도형 + 광원
    const a3 = mindarThree.addAnchor(2);
    a3.group.add(shapes3);
    a3.onTargetFound = () => { foundStep[3] = true; refreshUI(); };
    a3.onTargetLost  = () => { foundStep[3] = false; refreshUI(); };

    setProgress(96, 'AR 시작 중...');
    try { await mindarThree.start(); }
    catch (e) {
      started = false;
      showError('AR 시작 실패', (e && e.name === 'NotAllowedError')
        ? '카메라 권한이 거부됐어요. 설정에서 허용 후 다시 시도해 주세요.' : '다시 시도해 주세요.');
      return;
    }

    setProgress(100, '완료!');
    setTimeout(() => {
      splashEl.classList.add('hidden');
      setTimeout(() => { splashEl.style.display = 'none'; hintEl.classList.remove('hidden'); }, 500);
    }, 250);

    renderer.setAnimationLoop(() => renderer.render(scene, camera));
    forceResize(); setTimeout(forceResize, 300); setTimeout(forceResize, 800); setTimeout(forceResize, 1600);
  }

  function forceResize() { if (mindarThree) window.dispatchEvent(new Event('resize')); }
  window.addEventListener('orientationchange', () => { setTimeout(forceResize, 350); setTimeout(forceResize, 900); });

  startBtn.addEventListener('click', start);
  $('retry-btn').addEventListener('click', () => {
    errorBox.classList.remove('show'); startBtn.style.display = '';
    document.querySelector('.splash-title').style.display = '';
    setProgress(0, '로딩 중...'); start();
  });

  // 기본 ↔ 도형 (STEP1)
  function setShape(v) {
    isShape = v;
    toggleEl.classList.toggle('frame', isShape);
    $('seg-texture').classList.toggle('active', !isShape);
    $('seg-frame').classList.toggle('active', isShape);
    if (bearDefault && bearShape) { bearDefault.visible = !isShape; bearShape.visible = isShape; }
  }
  $('seg-texture').addEventListener('click', () => setShape(false));
  $('seg-frame').addEventListener('click', () => setShape(true));

  // 광원 방향 회전 (STEP3) — 0~1 → 방향광이 모델 주위를 돎 → 명암 변화
  function setLightAngle(t) {
    if (!dirLight) return;
    const a = t * Math.PI * 2;
    dirLight.position.set(Math.sin(a) * 5, 3.2, Math.cos(a) * 5);
  }
  $('light').addEventListener('input', (e) => setLightAngle(e.target.value / 100));
</script>
</body>
</html>
